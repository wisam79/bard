linters:
  enable:
    - gofmt
    - revive
    - gosimple
    - govet
    - errcheck
    - staticcheck
    - unused
    - gosec
    - gocritic
    - bodyclose
    - dupl
    - errorlint
    - goconst
    - gocyclo
    - goimports
    - misspell
    - nakedret
    - prealloc
    - stylecheck
    - unconvert

linters-settings:
  revive:
    min-confidence: 0.8
  govet:
    check-shadowing: true
  errcheck:
    check-type-assertions: true
    check-blank: true
  gosec:
    excludes:
      - G104
  gocritic:
    enabled-tags:
      - diagnostic
      - experimental
      - opinionated
      - performance
      - style
  gofmt:
    simplify: true
  stylecheck:
    checks:
      - "ST1000"
      - "ST1003"
      - "ST1016"
      - "ST1020"
      - "ST1021"
      - "ST1022"
  gocyclo:
    min-complexity: 15
  dupl:
    threshold: 150
  goconst:
    min-len: 3
    min-occurrences: 3

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - dupl
        - goconst
    - path: vendor/
      linters:
        - goimports
    - text: "declaration of \"err\" shadows"
      linters:
        - govet
    - path: .*_test\.go
      text: "func Test.*"
      linters:
        - gosec

run:
  timeout: 5m
  tests: true
  skip-dirs:
    - vendor
    - node_modules
    - frontend
    - build

output:
  format: colored-line-number
  print-issued-lines: true
  print-linter-name: true
